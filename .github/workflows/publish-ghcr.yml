name: Publish Multi-Arch Container to GHCR

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    name: Build, Push & Smoke-Test ghcr.io/ai-chili/aichili
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve package version
        id: meta
        run: |
          set -euo pipefail
          pkg_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::Release tag version ($tag_version) does not match package.json version ($pkg_version)"
              exit 1
            fi
          fi
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch GHCR image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ai-chili/aichili:latest
            ghcr.io/ai-chili/aichili:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify multi-arch manifest, OCI MCP label & stdio JSON-RPC handshake
        run: |
          set -euo pipefail
          manifest_out="$(docker buildx imagetools inspect "ghcr.io/ai-chili/aichili:${{ steps.meta.outputs.version }}")"
          echo "$manifest_out"
          echo "$manifest_out" | grep -q "linux/amd64"
          echo "$manifest_out" | grep -q "linux/arm64"

          docker pull ghcr.io/ai-chili/aichili:latest
          container_uid="$(docker run --rm --entrypoint id ghcr.io/ai-chili/aichili:latest -u)"
          test "$container_uid" != "0"

          mcp_label="$(docker inspect --format '{{index .Config.Labels "io.modelcontextprotocol.server.name"}}' ghcr.io/ai-chili/aichili:latest)"
          test "$mcp_label" = "io.github.AI-Chili/aichili"

          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ghcr-smoke","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"ping"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/list"}' \
            | docker run -i --rm ghcr.io/ai-chili/aichili:latest > /tmp/ghcr-mcp-out.jsonl

          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const expectedVersion = process.env.EXPECTED_VERSION;
            const frames = readFileSync("/tmp/ghcr-mcp-out.jsonl", "utf8").trim().split("\n").map((line) => JSON.parse(line));
            assert.equal(frames.length, 3);
            assert.equal(frames[0].id, 1);
            assert.equal(frames[0].result.protocolVersion, "2025-06-18");
            assert.equal(frames[0].result.serverInfo.name, "io.github.AI-Chili/aichili");
            assert.equal(frames[0].result.serverInfo.version, expectedVersion);
            assert.deepEqual(frames[1], { jsonrpc: "2.0", id: 2, result: {} });
            assert.equal(frames[2].id, 3);
            assert.equal(frames[2].result.tools.length, 7);
          '
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
